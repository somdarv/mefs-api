name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The key's authorized_keys entry carries a forced command, so the server
      # runs deploy-mefs-api.sh regardless of what is sent here. `script` is a
      # placeholder by design: a leaked key can run that one script, never a shell.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # The default 30s connect timeout has already produced one spurious
          # "dial tcp: i/o timeout" against this box. The deploy itself is
          # idempotent, so waiting longer is strictly cheaper than a false red.
          timeout: 120s
          command_timeout: 20m
          script: exit
